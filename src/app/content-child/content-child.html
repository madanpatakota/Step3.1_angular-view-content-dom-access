<div class="card shadow-sm border-0">
  <div class="card-header bg-primary text-white py-3">
    <h5 class="mb-0">Employee Information</h5>
  </div>

  <div class="card-body p-4">
    <div class="mb-4">
      <ng-content></ng-content>
    </div>

    <div class="d-flex gap-2 flex-wrap">
      <button class="btn btn-outline-primary" (click)="showEmployee()">
        Show First Employee
      </button>

      <button class="btn btn-primary" (click)="showEmployees()">
        Show All Employees
      </button>
    </div>

    @if (firstEmployeeName) {
      <div class="alert alert-success mt-4 mb-0">
        <strong>First Employee:</strong>
        {{ firstEmployeeName }}
      </div>
    }

    @if (employeeList.length > 0) {
      <div class="mt-4">
        <h6 class="text-primary mb-3">Employee List</h6>

        <div class="table-responsive">
          <table class="table table-bordered table-hover align-middle mb-0">
            <thead class="table-primary">
              <tr>
                <th class="text-center" style="width: 100px;">S.No</th>
                <th>Employee Name</th>
              </tr>
            </thead>

            <tbody>
              @for (employeeName of employeeList; track $index) {
                <tr>
                  <td class="text-center">{{ $index + 1 }}</td>
                  <td>{{ employeeName }}</td>
                </tr>
              }
            </tbody>
          </table>
        </div>
      </div>
    }
  </div>
</div>
