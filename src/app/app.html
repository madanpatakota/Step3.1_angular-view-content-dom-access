<div class="container py-4">

  <div class="card shadow-sm mb-4">

    <div class="card-header bg-primary text-white">
      <h4 class="mb-0">
        Angular View, Content & DOM Access
      </h4>
    </div>

    <div class="card-body">

      <label class="form-label fw-bold">
        Select Example
      </label>

      <select
        class="form-select"
        [value]="selectedExample()"
        (change)="changeExample($event)">

        <option value="01">
          01 - View & Content Basics
        </option>

        <option value="02">
          02 - ViewChild & ElementRef
        </option>

        <option value="03">
          03 - Content Queries
        </option>

        <option value="04">
          04 - Signal View Queries
        </option>

        <option value="05">
          05 - Signal Content Queries
        </option>

        <option value="06">
          06 - Template & Dynamic Views
        </option>

        <option value="07">
          07 - View Encapsulation
        </option>

        <option value="08">
          08 - Host Element
        </option>

      </select>

    </div>

  </div>


  <!-- Selected Example Output -->
@switch (selectedExample()) {

  @case ('01') {
    <div class="border rounded p-3">
      <app-view-content-basics />
    </div>
  }

  @case ('02') {
    <div class="border rounded p-3">
      <app-view-child-demo />
    </div>
  }

  @case ('03') {
    <div class="border rounded p-3">
      <app-content-parent />
    </div>
  }

  @case ('04') {
    <div class="border rounded p-3">
      <app-signal-view-demo />
    </div>
  }

  @case ('05') {
    <div class="border rounded p-3">
      <app-signal-content-parent />
    </div>
  }

  @case ('06') {
    <div class="border rounded p-3">
      <app-dynamic-view-demo />
    </div>
  }

  @case ('07') {
    <div class="border rounded p-3">
      <app-view-encapsulation-demo />
    </div>
  }

  @case ('08') {
    <div class="border rounded p-3">
      <app-host-element-demo />
    </div>
  }

}

</div>
