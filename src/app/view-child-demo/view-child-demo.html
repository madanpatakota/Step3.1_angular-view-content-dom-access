<div class="container mt-5">

  <div class="card shadow-sm">
    <div class="card-header bg-primary text-white">
      Employee Details
    </div>

    <div class="card-body">

      <label class="form-label">Employee Name</label>

      <input
        #employeeName
        type="text"
        class="form-control"
        placeholder="Enter employee name">

      <button
        class="btn btn-primary mt-3"
        (click)="showEmployee()">
        Show Employee
      </button>

    </div>
  </div>

</div>
