<div class="container mt-5">

  <div class="card shadow-sm">
    <div class="card-header bg-primary text-white">
      Employee Details
    </div>

    <div class="card-body">

      <label class="form-label">Employee Name</label>

      <input
        #employeeName
        type="text"
        class="form-control"
        placeholder="Enter employee name">

      <button
        class="btn btn-primary mt-3"
        (click)="showEmployee()">
        Show Employee
      </button>

    </div>
  </div>

</div>

<div class="card shadow-sm mt-4">
  <div class="card-header bg-primary text-white">
    Employee List - ViewChildren
  </div>

  <div class="card-body">
    <div class="mb-2">
      <input #employee class="form-control" value="Madan">
    </div>

    <div class="mb-2">
      <input #employee class="form-control" value="John">
    </div>

    <div class="mb-2">
      <input #employee class="form-control" value="Robert">
    </div>

    <button class="btn btn-primary mt-2" (click)="showEmployees()">
      Show Employees
    </button>

    <button class="btn btn-warning mt-2" (click)="ResetEmployees()">
      Reset Employees
    </button>

    @if (employeeList.length > 0) {
      <div class="table-responsive mt-4">
        <table class="table table-bordered table-striped">
          <thead class="table-primary">
            <tr>
              <th>S.No</th>
              <th>Employee Name</th>
            </tr>
          </thead>

          <tbody>
            @for (employeeName of employeeList; track $index) {
              <tr>
                <td>{{ $index + 1 }}</td>
                <td>{{ employeeName }}</td>
              </tr>
            }
          </tbody>
        </table>
      </div>
    }
  </div>
</div>
